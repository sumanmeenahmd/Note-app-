name: Build & Release Android APK

on:
  push:
    tags-ignore:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: my-upload-key.jks
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'NotesAppReleaseKey2026' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'NotesAppReleaseKey2026' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure release keystore exists and is uploaded to repository
        run: |
          git fetch origin "${GITHUB_REF_NAME}" || true
          if [ ! -f "$KEYSTORE_PATH" ]; then
            git checkout "origin/${GITHUB_REF_NAME}" -- "$KEYSTORE_FILE" 2>/dev/null || true
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Keystore not found. Generating $KEYSTORE_FILE for the first time..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Notes App, OU=Mobile, O=Notes, L=Unknown, ST=Unknown, C=US"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_FILE"
            git commit -m "chore: generate release keystore [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Using existing $KEYSTORE_FILE from repository."
          fi

      - name: Build signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare and verify Release APK
        run: |
          mkdir -p release-apks
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          TARGET_APK="release-apks/Notes-v${VERSION_NAME}.apk"
          cp "$APK_SOURCE" "$TARGET_APK"

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$TARGET_APK"
          fi
          ls -lh release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Notes v${{ env.VERSION_NAME }}
          make_latest: true
          generate_release_notes: true
          files: release-apks/Notes-v${{ env.VERSION_NAME }}.apk
